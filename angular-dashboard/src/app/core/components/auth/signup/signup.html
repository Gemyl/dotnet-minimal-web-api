<app-form-wrapper>
    <span class="font-bold text-3xl mb-5">Sign Up</span>
    <input type="email" placeholder="Enter email" [formField]="signupForm.email" class="w-[65%] border border-gray-400 px-2 py-1">
    <input type="password" placeholder="Enter password" [formField]="signupForm.password" class="w-[65%] border border-gray-400 mt-2 px-2 py-1">
    <input type="text" placeholder="Enter name (optional)" [formField]="signupForm.firstName" class="w-[65%] border border-gray-400 mt-2 px-2 py-1">
    <input type="text" placeholder="Enter last name (optional)" [formField]="signupForm.lastName" class="w-[65%] border border-gray-400 mt-2 px-2 py-1">
    <button type="submit" (click)="handleSignup()" class="w-[65%] bg-blue-600 text-white rounded-full mt-4 py-1 cursor-pointer  disabled:bg-gray-300 disabled:text-gray-500
    disabled:cursor-not-allowed" [disabled]="signupForm().invalid()">Submit</button>
</app-form-wrapper>
