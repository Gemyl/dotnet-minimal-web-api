<section class="toast-stack" aria-label="Notifications" aria-live="polite">
  @for (toast of toastService.toasts(); track toast.id) {
    <div class="toast" [class]="'toast toast-' + toast.type" [attr.role]="toast.type === 'error' ? 'alert' : 'status'">
      <span class="toast-icon" aria-hidden="true">{{ iconFor(toast.type) }}</span>
      <span class="toast-message">{{ toast.message }}</span>
      <button class="toast-close" type="button" aria-label="Dismiss notification" (click)="toastService.dismiss(toast.id)">×</button>
    </div>
  }
</section>
