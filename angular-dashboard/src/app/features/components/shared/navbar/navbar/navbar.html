<div class="flex flex-col justify-start items-center h-full w-20 bg-gray-200 border border-gray-300 absolute left-0 pt-4 px-2 shadow-xl">
    <div class="flex flex-col justify-center items-center cursor-pointer mb-4" (click)="router.navigate([_routes.PRODUCTS])">
        <i class="fa fa-tag"></i>
        <p class="text-xs">Products</p>
    </div>
    <div class="flex flex-col justify-center items-center cursor-pointer mb-4" (click)="router.navigate([_routes.CATEGORIES])">
        <i class="fa fa-layer-group"></i>

    <div class="flex flex-col justify-center items-center cursor-pointer mt-auto mb-4" (click)="logout()">
        <i class="fa-solid fa-arrow-right-to-bracket scale-x-[-1]"></i>
        <p class="text-xs">Logout</p>
